[project]
name = "invoice-extraction-zugferd"
version = "0.1.0"
description = "Rechnungsextraktion mit LLMs, gemessen gegen das in ZUGFeRD-PDFs eingebettete XML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "pydantic>=2.7",
    "pypdf>=5",
    "pandas>=2.2",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
invoice-extraction = "invoice_extraction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extraction"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
